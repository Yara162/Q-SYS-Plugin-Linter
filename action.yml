name: Q-SYS Plugin Linter
description: Check Q-SYS plugins for mistakes Designer and Cores trip on, with inline annotations.
branding:
  icon: check-square
  color: blue
inputs:
  files:
    description: Plugin files or globs, space-separated
    default: "*.qplug"
  fail-on:
    description: Lowest severity that fails the step (error, warning, info)
    default: error
  disable:
    description: Comma-separated rule IDs to skip
    default: ""
runs:
  using: composite
  steps:
    - name: Install Lua 5.3
      shell: bash
      run: command -v lua5.3 >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3)
    - name: Lint
      shell: bash
      run: |
        shopt -s nullglob globstar
        files=(${{ inputs.files }})
        if [ ${#files[@]} -eq 0 ]; then echo "::warning::no plugin files matched '${{ inputs.files }}'"; exit 0; fi
        PYTHONPATH="${{ github.action_path }}" python3 -m qsys_lint --format github \
          --fail-on "${{ inputs.fail-on }}" --disable "${{ inputs.disable }}" "${files[@]}"
