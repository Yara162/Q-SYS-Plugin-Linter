[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qsys-lint"
version = "0.1.0"
description = "Checks Q-SYS plugins (.qplug / .lua) for the mistakes Designer and Cores trip on."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
lua = ["lupa>=2.0"]

[project.scripts]
qsys-lint = "qsys_lint.cli:main"

[tool.setuptools]
packages = ["qsys_lint"]

[tool.setuptools.package-data]
qsys_lint = ["dump.lua"]
